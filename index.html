<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary ─────────────────────────────────────────────────────────── -->
    <!-- usePageTitle() in src/shared/hooks/ updates this per-route; this default
         is shown briefly before the first hook runs (and is the fallback for
         routes that haven't adopted the hook yet). -->
    <title>Intergalactic Soccer League</title>
    <meta
      name="description"
      content="A Blaseball-inspired social experiment browser game. Watch AI-simulated intergalactic soccer matches, bet Intergalactic Credits, and vote with fellow fans to reshape your club's future."
    />
    <meta name="theme-color" content="#111" />

    <!-- ── Icons ───────────────────────────────────────────────────────────── -->
    <!-- The ISL shield crest (orbit-ball + wordmark), centred on a square
         canvas — the owner's pick over the earlier minimal ball tile. SVG is
         preferred by modern browsers; the .ico (16/32/48) is the legacy fallback
         (sizes="any" nudges Chrome to pick the SVG). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Open Graph (Facebook, LinkedIn, Slack, Discord) ─────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intergalactic Soccer League" />
    <meta property="og:title" content="Intergalactic Soccer League" />
    <meta
      property="og:description"
      content="A Blaseball-inspired social experiment browser game. Watch AI-simulated intergalactic soccer matches, bet Intergalactic Credits, and vote with fellow fans to reshape your club's future."
    />
    <meta property="og:url" content="https://soccer-league-one.vercel.app/" />
    <!-- Stopgap: existing isl-logo.png (272x360) renders non-blank previews.
         Proper 1200x630 OG asset (32 crests + tagline) is a follow-up; see PR
         body. -->
    <meta property="og:image" content="https://soccer-league-one.vercel.app/isl-logo.png" />
    <meta property="og:image:alt" content="Intergalactic Soccer League logo" />

    <!-- ── Twitter / X ─────────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intergalactic Soccer League" />
    <meta
      name="twitter:description"
      content="A Blaseball-inspired social experiment browser game. Watch AI-simulated intergalactic soccer matches, bet Intergalactic Credits, and vote with fellow fans."
    />
    <meta name="twitter:image" content="https://soccer-league-one.vercel.app/isl-logo.png" />

    <style>
      @font-face {
        font-family: 'Space Mono';
        src: url('/fonts/SpaceMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Mono';
        src: url('/fonts/SpaceMono-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Mono';
        src: url('/fonts/SpaceMono-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Space Mono';
        src: url('/fonts/SpaceMono-BoldItalic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      /* Broadcast type (docs/design-language.md section 2): Space Grotesk for
         reading and interface text, Big Shoulders Display for headings and
         scores. Self-hosted variable woff2 (SIL Open Font License), Latin and
         Latin Extended split by unicode-range so most pages fetch one file
         each. */
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-latin.woff2') format('woff2');
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-latin-ext.woff2') format('woff2');
        font-weight: 300 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Big Shoulders Display';
        src: url('/fonts/BigShouldersDisplay-latin.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Big Shoulders Display';
        src: url('/fonts/BigShouldersDisplay-latin-ext.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- The two faces every page renders above the fold: fetched in parallel
         with the app bundle instead of after the CSS is parsed. -->
    <link rel="preload" href="/fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BigShouldersDisplay-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
